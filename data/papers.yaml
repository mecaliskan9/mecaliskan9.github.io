- title: How Does Work from Home Affect Mothers' Labor Supply During Summer School Closures?
  authors:
  - Mustafa Enes Çalışkan
  year: 2026
  status: working paper
  venue: ''
  pdf: https://drive.google.com/file/d/14D3Mo0b9reGN7p7C1S4aXUSCLuMtJSe1/view?usp=drive_link
  link: ''
  abstract: Each summer, school closures increase childcare demand and contribute to a seasonal decline
    in mothers' labor force participation. Access to work from home may mitigate this decline. Using monthly
    Current Population Survey data on mothers whose youngest child is aged 6 to 12, I find that the decline
    in employment in July is 2.6 percentage points smaller for mothers with access to work from home than
    for mothers who work exclusively onsite. The gap emerges in June, peaks in July, narrows by August,
    and shifts with the timing of state school calendars. The effect comes mainly from labor force exits,
    with a smaller and less precise contribution from unemployment, and mothers who leave the labor force
    most often report family care as the reason. I find no effect on hours among employed mothers. No
    comparable response appears among fathers or women without children, and a pre-COVID placebo from
    a period when remote work was rare shows no similar summer pattern. More broadly, the findings show
    that access to flexible work arrangements can shape whether temporary increases in childcare demand
    lead to interruptions in mothers' employment.
  job_market_paper: true
- title: Online Gambling Legalization and Household Credit Card Debt
  authors:
  - Mustafa Enes Çalışkan
