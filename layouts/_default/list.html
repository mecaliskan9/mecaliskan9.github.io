{{ define "main" }}
<section class="page">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul class="compact-list">
    {{ range .Pages }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> <span class="meta">{{ .Date.Format "Jan 2, 2006" }}</span></li>
    {{ end }}
  </ul>
  <p class="back-link"><a href="{{ .Site.Home.RelPermalink }}">&larr; Back to homepage</a></p>
</section>
{{ end }}
